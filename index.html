<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>에디션 버전 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --bg-secondary: #f5f5f4;
  --text: #1c1c1a;
  --text-secondary: #6b6b68;
  --border: rgba(0,0,0,0.15);
  --border-secondary: rgba(0,0,0,0.3);
  --radius-md: 8px;
  --font: system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1a;
    --bg-secondary: #2c2c2a;
    --text: #f0ede8;
    --text-secondary: #a0a09a;
    --border: rgba(255,255,255,0.15);
    --border-secondary: rgba(255,255,255,0.3);
  }
}
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); }
#app { display: flex; flex-direction: column; height: 100vh; padding: 16px; gap: 12px; max-width: 900px; margin: 0 auto; }
#table-wrap { flex: 1; overflow-y: auto; border: 0.5px solid var(--border); border-radius: var(--radius-md); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
col.c-edition { width: 200px; }
col.c-ver { width: 140px; }
col.c-date { width: 140px; }
col.c-doc { width: 140px; }
col.c-ctrl { width: 110px; }
thead th { position: sticky; top: 0; background: var(--bg-secondary); font-weight: 500; font-size: 13px; padding: 9px 12px; text-align: left; border-bottom: 0.5px solid var(--border); color: var(--text-secondary); z-index: 2; }
tbody tr { border-bottom: 0.5px solid var(--border); transition: background 0.15s; }
tbody tr:last-child { border-bottom: none; }
td { padding: 8px 12px; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.doc-cell { display: flex; align-items: center; gap: 6px; padding: 8px 12px; }
.cb-wrap { display: flex; gap: 6px; align-items: center; }
.doc-cb { width: 16px; height: 16px; cursor: pointer; }
.ctrl-cell { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.btn-x { background: none; border: 0.5px solid #22c55e99; color: #16a34a; border-radius: var(--radius-md); width: 26px; height: 26px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-x:hover { background: #dcfce7; }
.btn-confirm { background: none; border: 0.5px solid #ef444499; color: #dc2626; border-radius: var(--radius-md); width: 26px; height: 26px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; }
.btn-confirm:hover { background: #fee2e2; }
.btn-confirm svg.timer-ring { position: absolute; top: -3px; left: -3px; width: 32px; height: 32px; pointer-events: none; transform: rotate(-90deg); }
.btn-confirm svg.timer-ring circle { fill: none; stroke: #ef444488; stroke-width: 2; stroke-dasharray: 88; stroke-dashoffset: 88; transition: stroke-dashoffset 0.1s linear; }
.btn-move { background: none; border: 0.5px solid var(--border); color: var(--text-secondary); border-radius: var(--radius-md); width: 26px; height: 26px; cursor: pointer; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.btn-move:hover { background: var(--bg-secondary); }
#input-area { display: flex; flex-direction: column; gap: 6px; }
#action-bar { display: flex; gap: 8px; align-items: center; }
#editor { width: 100%; min-height: 72px; resize: vertical; font-family: var(--font-mono); font-size: 13px; padding: 9px 12px; border: 0.5px solid var(--border); border-radius: var(--radius-md); background: var(--bg); color: var(--text); line-height: 1.6; }
#editor:focus { outline: none; border-color: var(--border-secondary); }
#insert-btn { padding: 6px 16px; font-size: 13px; border: 0.5px solid var(--border-secondary); border-radius: var(--radius-md); background: var(--bg); color: var(--text); cursor: pointer; }
#insert-btn:hover { background: var(--bg-secondary); }
#error-msg { font-size: 12px; color: #dc2626; }
#insert-pos-label { font-size: 12px; color: var(--text-secondary); flex: 1; }
</style>
</head>
<body>
<div id="app">
  <div id="table-wrap">
    <table>
      <colgroup>
        <col class="c-edition"><col class="c-ver"><col class="c-date"><col class="c-doc"><col class="c-ctrl">
      </colgroup>
      <thead>
        <tr>
          <th>에디션</th><th>버전명</th><th>출시 날짜</th><th>문서 존재 여부</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div id="input-area">
    <div id="action-bar">
      <span id="insert-pos-label">삽입 위치: 맨 아래</span>
      <button id="insert-btn">입력</button>
      <span id="error-msg"></span>
    </div>
    <textarea id="editor" placeholder="에디션|버전명|출시날짜&#10;예: A 에디션|1.0|2026/01/01"></textarea>
  </div>
</div>

<script>
const ROW_COLORS = [
  'rgba(239,68,68,0.5)',
  'rgba(251,191,36,0.5)',
  'rgba(34,197,94,0.5)'
];
const TIMEOUT_MS = 7000;

let rows = [];
let nextId = 1;
let insertAfterIdx = null;
const deleteTimers = {};

const tbody = document.getElementById('tbody');
const editor = document.getElementById('editor');
const errorMsg = document.getElementById('error-msg');
const insertPosLabel = document.getElementById('insert-pos-label');

function updateInsertLabel() {
  if (insertAfterIdx === null) insertPosLabel.textContent = '삽입 위치: 맨 아래';
  else if (insertAfterIdx === -1) insertPosLabel.textContent = '삽입 위치: 1행 위';
  else insertPosLabel.textContent = `삽입 위치: ${insertAfterIdx + 1}행 아래`;
}

function cancelDeleteTimer(id) {
  if (deleteTimers[id]) {
    clearInterval(deleteTimers[id].interval);
    clearTimeout(deleteTimers[id].timeout);
    delete deleteTimers[id];
  }
}

function startDeleteTimer(id) {
  cancelDeleteTimer(id);
  const start = Date.now();
  const interval = setInterval(() => {
    const elapsed = Date.now() - start;
    const progress = Math.min(elapsed / TIMEOUT_MS, 1);
    const circle = document.querySelector(`.timer-ring[data-id="${id}"] circle`);
    if (circle) circle.style.strokeDashoffset = 88 * (1 - progress);
  }, 50);
  const timeout = setTimeout(() => {
    clearInterval(interval);
    const row = rows.find(r => r.id === id);
    if (row) { row.confirmDelete = false; render(); }
    delete deleteTimers[id];
  }, TIMEOUT_MS);
  deleteTimers[id] = { interval, timeout };
}

function render() {
  tbody.innerHTML = '';
  rows.forEach((row, i) => {
    const tr = document.createElement('tr');
    if (row.doc > 0) tr.style.background = ROW_COLORS[row.doc - 1];
    const isLast = i === rows.length - 1;

    tr.innerHTML = `
      <td title="${row.edition}">${row.edition}</td>
      <td title="${row.version}">${row.version}</td>
      <td title="${row.date}">${row.date}</td>
      <td class="doc-cell">
        <div class="cb-wrap">
          <input type="checkbox" class="doc-cb" data-id="${row.id}" data-val="1" ${row.doc===1?'checked':''} title="빨간색">
          <input type="checkbox" class="doc-cb" data-id="${row.id}" data-val="2" ${row.doc===2?'checked':''} title="노란색">
          <input type="checkbox" class="doc-cb" data-id="${row.id}" data-val="3" ${row.doc===3?'checked':''} title="초록색">
        </div>
      </td>
      <td class="ctrl-cell">
        ${row.confirmDelete
          ? `<button class="btn-confirm" data-id="${row.id}" data-action="confirmDel" title="삭제 확인">
               <i class="ti ti-check"></i>
               <svg class="timer-ring" data-id="${row.id}" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                 <circle cx="16" cy="16" r="14"/>
               </svg>
             </button>`
          : `<button class="btn-x" data-id="${row.id}" data-action="del" title="삭제"><i class="ti ti-x"></i></button>`
        }
        <button class="btn-move" data-id="${row.id}" data-action="up" title="이 행 위에 삽입"><i class="ti ti-chevron-up"></i></button>
        ${isLast ? `<button class="btn-move" data-id="${row.id}" data-action="down" title="이 행 아래에 삽입"><i class="ti ti-chevron-down"></i></button>` : ''}
      </td>
    `;

    if (insertAfterIdx === -1 && i === 0) {
      const marker = document.createElement('tr');
      marker.innerHTML = `<td colspan="5" style="height:3px;background:#60a5fa88;padding:0;"></td>`;
      tbody.appendChild(marker);
    }
    tbody.appendChild(tr);
    if (insertAfterIdx === i) {
      const marker = document.createElement('tr');
      marker.innerHTML = `<td colspan="5" style="height:3px;background:#60a5fa88;padding:0;"></td>`;
      tbody.appendChild(marker);
    }
  });

  tbody.querySelectorAll('input.doc-cb').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = +e.target.dataset.id;
      const val = +e.target.dataset.val;
      const row = rows.find(r => r.id === id);
      if (!row) return;
      row.doc = row.doc === val ? 0 : val;
      render();
    });
  });

  tbody.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = +btn.dataset.id;
      const action = btn.dataset.action;
      const idx = rows.findIndex(r => r.id === id);
      if (action === 'del') {
        rows[idx].confirmDelete = true;
        render();
        startDeleteTimer(id);
      } else if (action === 'confirmDel') {
        cancelDeleteTimer(id);
        rows.splice(idx, 1);
        if (insertAfterIdx !== null && insertAfterIdx >= rows.length) insertAfterIdx = null;
        render();
        updateInsertLabel();
      } else if (action === 'up') {
        insertAfterIdx = idx === 0 ? -1 : idx - 1;
        render(); updateInsertLabel();
      } else if (action === 'down') {
        insertAfterIdx = idx;
        render(); updateInsertLabel();
      }
    });
  });
}

document.getElementById('insert-btn').addEventListener('click', () => {
  const text = editor.value.trim();
  if (!text) return;
  const lines = text.split('\n').map(l => l.trim()).filter(l => l);
  const newRows = [];
  let hasError = false;
  for (const line of lines) {
    const parts = line.split('|');
    if (parts.length !== 3) { hasError = true; break; }
    const [edition, version, date] = parts.map(p => p.trim());
    if (!edition || !version || !date) { hasError = true; break; }
    newRows.push({ id: nextId++, edition, version, date, doc: 0, confirmDelete: false });
  }
  if (hasError) { errorMsg.textContent = '오류: 형식이 올바르지 않습니다. (에디션|버전명|날짜)'; return; }
  errorMsg.textContent = '';
  if (insertAfterIdx === null) {
    rows.push(...newRows);
  } else if (insertAfterIdx === -1) {
    rows.unshift(...newRows);
    insertAfterIdx = newRows.length - 1;
  } else {
    rows.splice(insertAfterIdx + 1, 0, ...newRows);
    insertAfterIdx = insertAfterIdx + newRows.length;
  }
  editor.value = '';
  render(); updateInsertLabel();
});

editor.addEventListener('input', () => { errorMsg.textContent = ''; });

render();
updateInsertLabel();
</script>
</body>
</html>
